# Manual preview deploy for yonder3/spares when Git integration is on the wrong repo.
# Requires repository secrets: VERCEL_TOKEN (team yonder3 scope).
name: Manual Vercel preview (yonder3)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit SHA to deploy (preview only)
        required: true
        default: 0ec7e601b02053cc3c564e964689eaca41789955

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Deploy preview to Vercel (yonder3 / spares)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Deploying commit ${SHA}"
          npx vercel@59.17.0 deploy --yes \
            --scope yonder3 \
            --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=${SHA}" \
            | tee vercel-deployment-url.txt

      - name: Print preview URL
        run: |
          echo "Preview URL:"
          cat vercel-deployment-url.txt

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const url = fs.readFileSync("vercel-deployment-url.txt", "utf8").trim();
            const body = `## Vercel Preview\n\n${url}\n\n_Scroll home → **Care and quotes** to smoke scroll-scrub._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "## Vercel Preview";
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
